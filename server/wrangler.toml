name = "monolith-server"
main = "src/index.ts"
account_id = "54a48beaa1b4d3e852d3f80a74b8de0a"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

[vars]
# 非敏感配置变量（敏感的用 wrangler secret put）
BLOG_NAME = "浅草物语"
# 对外公开域名（用于 sitemap.xml / robots.txt 的绝对 URL）
SITE_ORIGIN = "https://www.chillg.de"
# 运行时默认不做建表/补列；部署流程负责迁移与 schema reconcile。
AUTO_SCHEMA_MIGRATION = "false"
# AE GraphQL 查询所需的账户 ID（非敏感；查询令牌走 CLOUDFLARE_API_TOKEN secret）
CLOUDFLARE_ACCOUNT_ID = "54a48beaa1b4d3e852d3f80a74b8de0a"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "monolith-db"
database_id = "905287a3-2a60-4bad-af5a-a7714f32b65b"
migrations_dir = "src/migrations"

# R2 存储桶绑定
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "monolith-assets"

# Analytics Engine 数据集绑定（CF 专属增强分析模块）
# 灵感来源: HanAnalytics (MIT) — https://github.com/uxiaohan/HanAnalytics
# 仅在 Cloudflare 部署时生效，Turso/PG 后端会自动跳过 AE 写入与查询
[[analytics_engine_datasets]]
binding = "AE"
dataset = "monolith_analytics"

# 定时触发器 (每 1 分钟执行一次)
[triggers]
crons = ["* * * * *"]
